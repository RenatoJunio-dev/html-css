<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo classes </title>
    <style>
div{
    display: inline-block;
    width: 200px;
    height: 500px;
    text-align: center;
    border: 2px solid black;
    
    background-color: rgba(255, 8, 0, 0.336);


}
#d1:hover, #d3:hover, #d5:hover {
    background-color: blue;
    
}
#d2:hover, #d4:hover {
    background-color: rgb(18, 204, 12);
}
    </style>

</head>
<body>
    <div id="d1">
        01
    </div>
    <div id="d2">
        02
    </div>
    <div id="d3">
        03
    </div>
    <div id="d4">
        04
    </div>
    <div id="d5">
        05
    </div>
    
</body>
</html>
