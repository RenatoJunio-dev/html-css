<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        caption{
            font-size: 1.5em;
            font-family: Arial, Helvetica, sans-serif;
            background-color: blanchedalmond;

        }
        table{
             font-family: Arial, Helvetica, sans-serif;
             border-collapse:collapse ;
             width: 550px;
             height: 100px;
             padding: 10px;



        }
        th, td {
            border: 1px solid black;
            text-align: center;
          padding: 10px;
          
      }


        
      thead , th {
        background-color: gray;
      }
    </style>
</head>
<body>
   
    <table>
         <caption>
Filmes favoritos
    </caption>
        <thead>
            <tr>
                <th>Grupos</th>
                <th>Nomes</th>
                <th colspan="3">Filmes</th>
            </tr>
        </thead>
        <tr>
            <th rowspan="3">Mulheres</th>
            <td>Beatriz Souza </td>
            <td>Hulk</td>
            <td>Inception</td>
            <td>Batman</td>
        </tr>
        <tr>
            <td>Ana Maria Santos </td>
            <td>Alien</td>
            <td>Rambo</td>
            <td>Vingadores</td>
        </tr>
        
        <tr>
            <td>Cládia Melo</td>
            <td>Oblivion</td>
            <td>Matrix</td>
            <td>Big Hero</td>
        </tr>
        <tr>
            <th rowspan="3">Homens</th>
            <td>Bruno Mendonça</td>
            <td>Intocaveis</td>
            <td>Amnesia</td>
            <td>Gladiador</td>
        </tr>
        <tr>
            <td>Daniel Lourenço</td>
            <td>Wall-E</td>
            <td>Oldboy</td>
            <td>Dangal</td>
        </tr>
        <tr>
            <td>Fabiano Mota</td>
            <td>Star Wars V</td>
            <td>Taxi Driver</td>
            <td>Toy Story</td>
        </tr>


    </table>
    
</body>
</html>
