<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir a página em diferentes dispositivos para ver a imagem mudar conforme o tamanho da tela.</p>
    <picture>
        <source media="(max-width: 750px )" srcset="imagem/foto-p.png" type="image/png">
        <source media="(max-width: 1050px )" srcset="imagem/foto-m.png" type="image/png">
        <img src="imagem/foto-g.png" alt="imagem flexivel">
    </picture>
    <h1>Reproduzindo áudio</h1>
    <p>Vamos aprender a reproduzir áudio em HTML5.</p>
    
        <audio controls loop autoplay> 
        
          <source src="midia/Timeofyourlife - PatrickJordanPatrikios.mp3" type="audio/mpeg"> 
            <source src="midia/Gravação.m4a" type="audio/mpeg"> 
            <h1>Inserindo videos hospedados localmente</h1>
            p>Vamos aprender a reproduzir vídeos em HTML5.</p>
            <video src="midia/videossd.mp4"></video>
        </audio>
    </audio>
        
            
           
    
</body>
</html>
